<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!--
  One template for every slide and reel frame. scripts/render.mjs opens it in
  Playwright, calls window.paint(slide, ctx) and takes a screenshot.
  Look (docs/marca.md): a squared school notebook corrected by the teacher.
  Navy ink, blue ballpoint notes, yellow highlighter, red correction marks.
  No gradients, no stock icons.

  slides.json "theme": "mate" (default, blue ballpoint) or "fisica" (orange).
  Slide "bg": "strong" (navy board) or "soft" (highlighter yellow).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Kalam:wght@400;700&display=block" rel="stylesheet">
<style>
  :root {
    --paper: #f8f5ee;
    --grid: #cddcee;
    --margin: #e8a39b;
    --ink: #1c2a4a;
    --muted: #5d6882;
    --pen: #2a5bd7;
    --marker: #ffe14d;
    --red: #d8443a;
    --strong: #1c2a4a;
    --on-strong: #f8f5ee;
    --on-pen: #8fb0ff;
    --w: 1080px;
    --h: 1350px;
  }
  body[data-theme="fisica"] { --pen: #e2661c; --on-pen: #ffb27a; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: var(--w); height: var(--h); overflow: hidden; background: var(--paper); }
  body { font-family: "Atkinson Hyperlegible", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  /* The notebook: 54 px squares and a red margin line. */
  .slide { position: relative; width: var(--w); height: var(--h); padding: 120px 104px 150px 150px; display: flex; flex-direction: column; overflow: hidden;
    background-color: var(--paper);
    background-image: linear-gradient(var(--grid) 2px, transparent 2px), linear-gradient(90deg, var(--grid) 2px, transparent 2px);
    background-size: 54px 54px; background-position: -1px -1px; }
  .slide::before { content: ""; position: absolute; top: 0; bottom: 0; left: 104px; width: 3px; background: var(--margin); }
  .slide.strong { background-color: var(--strong); color: var(--on-strong);
    background-image: linear-gradient(rgba(248, 245, 238, .07) 2px, transparent 2px), linear-gradient(90deg, rgba(248, 245, 238, .07) 2px, transparent 2px); }
  .slide.strong::before { background: rgba(232, 163, 155, .35); }
  .slide.soft { background-color: #fff3a8; }
  .on .muted, .on .foot { color: color-mix(in srgb, var(--on-strong) 75%, transparent); }

  .grain { position: absolute; inset: 0; pointer-events: none; mix-blend-mode: multiply; opacity: .18; }
  .on .grain { opacity: .3; }

  /* Logo: "copér" in ink, "nico" in pen, all lowercase; the orbit icon cuts its
     line around the planet with --cut, the colour behind the logo. */
  .logo { --cut: var(--paper); display: inline-flex; align-items: center; gap: .26em; font: 800 40px/1 "Bricolage Grotesque", sans-serif; font-variation-settings: "opsz" 96; letter-spacing: -.035em; color: var(--ink); position: relative; }
  .logo b { color: var(--pen); font-weight: 800; }
  .logo svg { width: 1.5em; height: 1.5em; flex: none; margin-top: .04em; }
  .on .logo { --cut: var(--strong); color: var(--on-strong); }
  .on .logo b { color: var(--on-pen); }

  .kicker { font: 700 50px/1.1 Kalam, cursive; color: var(--pen); position: relative; display: inline-block; margin-bottom: 30px; }
  .on .kicker { color: var(--on-pen); }

  h1, h2 { font-family: "Bricolage Grotesque", sans-serif; font-variation-settings: "opsz" 96; font-weight: 750; letter-spacing: -.025em; }
  h1 { font-size: 104px; line-height: 1.0; }
  h2 { font-size: 72px; line-height: 1.06; }
  h1 em, h2 em { font-style: normal; color: var(--pen); }
  .on h1 em, .on h2 em { color: var(--on-pen); }
  .body { font: 400 40px/1.4 "Atkinson Hyperlegible", sans-serif; margin-top: 40px; max-width: 840px; }
  .body p + p { margin-top: 26px; }
  .body strong { font-weight: 700; }
  .lines { list-style: none; margin-top: 46px; display: grid; gap: 30px; }
  .lines li { font: 400 40px/1.36 "Atkinson Hyperlegible", sans-serif; padding-left: 52px; position: relative; max-width: 840px; }
  .lines li > span { position: absolute; left: -16px; top: -2px; }
  .hand { font: 400 52px/1.15 Kalam, cursive; color: var(--pen); }
  .on .hand { color: var(--on-pen); }

  /* Highlighter behind a word: --p is how far the marker has gone (0 to 1). */
  .hl { --p: 1; background: linear-gradient(var(--marker), var(--marker)) no-repeat 0 62% / calc(var(--p) * 100%) 72%; padding: 0 .08em; margin: 0 -.08em; border-radius: 4px; }
  .on .hl { color: var(--ink); }
  .x { position: relative; }
  .x::after { content: ""; position: absolute; left: -6%; right: -6%; top: 52%; height: .09em; background: var(--red); transform: rotate(-8deg) scaleX(var(--p, 1)); transform-origin: left; border-radius: 4px; }

  .note { margin-top: 48px; border: 2px solid rgba(28, 42, 74, .18); border-radius: 6px; padding: 44px 48px; background: rgba(255, 255, 255, .7); transform: rotate(-.6deg); }
  .note .hand { display: block; margin-bottom: 18px; }
  .note ol { margin: 8px 0 0 0; padding-left: 40px; font: 400 38px/1.4 "Atkinson Hyperlegible", sans-serif; }
  .note ol li + li { margin-top: 16px; }

  .grow { flex: 1; }
  .center { margin: auto 0; }
  .art { position: absolute; pointer-events: none; }

  .foot { position: absolute; left: 150px; right: 104px; bottom: 70px; display: flex; justify-content: space-between; align-items: baseline; font: 700 26px/1 "Atkinson Hyperlegible", sans-serif; letter-spacing: .02em; color: var(--muted); }
  .swipe { font: 700 42px/1 Kalam, cursive; letter-spacing: 0; color: var(--pen); }
  .on .swipe { color: var(--on-pen); }

  .cta { align-items: flex-start; }
  .portrait { width: 300px; height: 300px; border-radius: 50%; overflow: hidden; border: 10px solid var(--paper); box-shadow: 0 0 0 3px var(--pen); margin-bottom: 56px; }
  .portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
  .sign { font: 700 96px/1 Kalam, cursive; color: var(--pen); margin-top: 36px; transform: rotate(-4deg); transform-origin: left; }
  .on .sign { color: var(--on-pen); }

  /* Short carousels (slides.json "textSize": "large"): fewer words, bigger type. */
  body.large h2 { font-size: 90px; }
  body.large .body { font-size: 50px; }
  body.large .lines { gap: 40px; }
  body.large .lines li { font-size: 54px; padding-left: 60px; }
  body.large .lines li > span { top: 4px; }
  body.large .kicker { font-size: 60px; }
  body.large .hand { font-size: 62px; }
  body.large .note ol { font-size: 48px; }
  body.large .note ol li + li { margin-top: 22px; }

  /* Reel frames: a notebook on a desk, filmed by a virtual camera (scripts/render/reel.js). */
  body.reel { width: 1080px; height: 1920px; background: #141822; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .desk { position: absolute; inset: 0; background: radial-gradient(ellipse 80% 60% at 40% 35%, #3a3128 0%, #241f1b 55%, #15120f 100%); }
  .cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; will-change: transform; }
  body.reel .sheet { position: absolute; inset: 0; width: 1080px; height: 1920px; padding: 0; box-shadow: 0 50px 120px rgba(0, 0, 0, .55), 0 8px 24px rgba(0, 0, 0, .35); }
  .scene { position: absolute; inset: 0; padding: 300px 104px 640px 150px; display: flex; flex-direction: column; visibility: hidden; }
  .light { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 70% 45% at 28% 18%, rgba(255, 228, 180, .16), transparent 70%), radial-gradient(ellipse 95% 75% at 50% 46%, transparent 55%, rgba(12, 10, 8, .5) 100%); }
  .dof { position: absolute; inset: 0; pointer-events: none; backdrop-filter: blur(4px); -webkit-mask-image: linear-gradient(black 0, transparent 13%, transparent 84%, black 100%); mask-image: linear-gradient(black 0, transparent 13%, transparent 84%, black 100%); }
  .film { position: absolute; inset: 0; pointer-events: none; opacity: .07; mix-blend-mode: overlay; }
  .reel-logo { position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center; }
  .reel-logo .logo { padding: 16px 30px; border-radius: 999px; background: rgba(248, 245, 238, .92); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); font-size: 36px; }
  .c { display: inline-block; white-space: pre; }
  .wd { display: inline-block; }
  .pen { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; z-index: 5; }
  .confetti { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .pt { position: absolute; left: 0; top: 0; display: none; border-radius: 3px; }
  .pt.s0 { border-radius: 50%; }
  .pt.s2 { border: 5px solid currentColor; border-radius: 50%; }
  .pt.d { border-radius: 50%; filter: blur(5px); }

  /* Answer options: cards that land on the page. */
  .options { display: grid; gap: 30px; margin-top: 60px; justify-items: start; }
  .option { display: flex; align-items: center; gap: 36px; min-width: 560px; padding: 20px 44px 20px 22px; border: 5px solid var(--ink); border-radius: 30px; background: #fffdf7; box-shadow: 0 12px 0 var(--ink); font: 800 92px/1 "Bricolage Grotesque", sans-serif; font-variation-settings: "opsz" 96; font-variant-numeric: tabular-nums; opacity: 0; }
  .option .letter { display: grid; place-items: center; width: 104px; height: 104px; border-radius: 50%; background: var(--pen); color: #fff; font: 700 70px/1 Kalam, cursive; }
  .option:nth-child(2) .letter { background: var(--red); }
  .option:nth-child(3) .letter { background: #1f9d55; }

  /* Subtitles, CapCut style: thick outline, the word being said in yellow. */
  #subs { position: absolute; left: 50px; right: 50px; top: 1370px; display: flex; flex-wrap: wrap; justify-content: center; gap: 0 32px; text-align: center; font: 800 80px/1.15 "Bricolage Grotesque", sans-serif; font-variation-settings: "opsz" 96; letter-spacing: -.01em; }
  #subs .sw { display: inline-block; color: #fff; text-shadow: 7.0px 0.0px 0 #101828, 6.5px 2.7px 0 #101828, 4.9px 4.9px 0 #101828, 2.7px 6.5px 0 #101828, 0.0px 7.0px 0 #101828, -2.7px 6.5px 0 #101828, -4.9px 4.9px 0 #101828, -6.5px 2.7px 0 #101828, -7.0px 0.0px 0 #101828, -6.5px -2.7px 0 #101828, -4.9px -4.9px 0 #101828, -2.7px -6.5px 0 #101828, -0.0px -7.0px 0 #101828, 2.7px -6.5px 0 #101828, 4.9px -4.9px 0 #101828, 6.5px -2.7px 0 #101828, 0 12px 18px rgba(0, 0, 0, .45); }
  #subs .sw.now { color: var(--marker); }

  /* A board eraser: wooden back, felt underneath. */
  .eraser { position: absolute; left: 0; top: 0; width: 330px; height: 128px; border-radius: 14px; overflow: hidden; box-shadow: 0 30px 40px rgba(28, 42, 74, .35); pointer-events: none; display: none; z-index: 6; }
  .eraser .wood { height: 62%; background: linear-gradient(#d59a63, #b97d47); border-bottom: 6px solid #8f5d33; }
  .eraser .felt { height: 38%; background: repeating-linear-gradient(90deg, #3d4352 0 6px, #464d5e 6px 12px); }
  .dust { position: absolute; inset: 0; pointer-events: none; }

  /* Working on the notebook: one line per step, written under the last. */
  .eq { display: grid; gap: 8px; margin-top: 10px; }
  .eqline { position: relative; font: 800 136px/1.18 "Bricolage Grotesque", sans-serif; font-variation-settings: "opsz" 96; letter-spacing: -.02em; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .eqline .mark { font: 700 120px/1 Kalam, cursive; margin-left: 30px; }
  .eqline .mark.ok { color: #1f9d55; }
  .eqline .mark.bad { color: var(--red); }
  .eqnote { font: 400 54px/1.1 Kalam, cursive; color: var(--red); margin: -6px 0 18px 6px; }
  .steps { list-style: none; margin-top: 56px; display: grid; gap: 46px; counter-reset: s; }
  .steps li { counter-increment: s; position: relative; padding-left: 140px; font: 700 62px/1.15 "Atkinson Hyperlegible", sans-serif; }
  .steps li::before { content: counter(s); position: absolute; left: 17px; top: 6px; width: 78px; text-align: center; font: 700 72px/1 Kalam, cursive; color: var(--red); }
  .steps li .ring { position: absolute; left: -12px; top: -24px; color: var(--red); }
</style>
</head>
<body>
<div id="root"></div>
<script>
const HANDLE = '@copernico.clases';
const SIGN = 'Nico';

// Seeded random, so a re-render draws the same "hand-drawn" strokes.
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => ((s = Math.imul(s ^ (s >>> 15), 2246822507) ^ Math.imul(s ^ (s >>> 13), 3266489909)) >>> 0) / 4294967296;
}

/** A circle drawn by hand (a teacher's correction): two loose passes that don't quite close. */
function handCircle(r, { seed = 1, color = 'currentColor', width = 4, passes = 2, squash = 1 } = {}) {
  const rand = rng(seed);
  const pad = 20;
  const w = r * 2 + pad * 2;
  const h = r * 2 * squash + pad * 2;
  let paths = '';
  for (let p = 0; p < passes; p++) {
    const start = rand() * Math.PI * 2;
    const sweep = Math.PI * 2 * (p ? 0.92 + rand() * 0.06 : 1.04);
    const pts = [];
    for (let i = 0; i <= 64; i++) {
      const a = start + (sweep * i) / 64;
      const wob = 1 + (rand() - 0.5) * 0.025 + Math.sin(a * 3 + p) * 0.012;
      pts.push([w / 2 + Math.cos(a) * r * wob * (1 + p * 0.015), h / 2 + Math.sin(a) * r * squash * wob * (1 - p * 0.01)]);
    }
    paths += `<path d="M${pts.map((q) => q.map((v) => v.toFixed(1)).join(' ')).join(' L')}" fill="none" stroke="${color}" stroke-width="${p ? width * 0.6 : width}" stroke-linecap="round" stroke-linejoin="round" opacity="${p ? 0.55 : 0.9}"/>`;
  }
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${paths}</svg>`;
}

/** Bullet: a tiny hand-drawn circle in red pen. */
const handDot = (seed) => `<span style="color:var(--red)">${handCircle(9, { seed, width: 3.5, passes: 1 })}</span>`;

const grain = (seed) => `<svg class="grain" width="100%" height="100%"><filter id="g${seed}"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="${seed}" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .42  0 0 0 0 .4  0 0 0 0 .36  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#g${seed})"/></svg>`;

/**
 * Logo: the Sun in the middle and a planet going round it (Copernicus), then
 * "copérnico" with "nico" in the pen colour.
 */
const orbit = `<svg viewBox="0 0 120 120"><g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="round">
  <ellipse cx="60" cy="60" rx="56" ry="34" transform="rotate(-20 60 60)"/>
  <circle cx="60" cy="60" r="14" fill="var(--marker)"/>
  <circle cx="96.0" cy="34.0" r="10" fill="var(--red)" stroke="var(--cut)" stroke-width="5" transform="rotate(-20 60 60)"/>
</g></svg>`;
const logo = () => `<span class="logo">${orbit}<span>copér<b>nico</b></span></span>`;

const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
/** *colour*, **bold**, [highlighter] and ~crossed out~, nothing else. */
const md = (s) => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
  .replace(/\*(.+?)\*/g, '<em>$1</em>')
  .replace(/\[(.+?)\]/g, '<span class="hl">$1</span>')
  .replace(/~(.+?)~/g, '<span class="x">$1</span>')
  .replace(/\n/g, '<br>');
const paras = (s) => String(s ?? '').split(/\n\n+/).map((p) => `<p>${md(p)}</p>`).join('');

function kicker(text) {
  if (!text) return '';
  return `<div><span class="kicker"><span class="hl">${esc(text)}</span></span></div>`;
}

/** Decorative red circles, like a teacher's correction. */
function art(a, seed) {
  if (!a) return '';
  const color = a.color ?? 'var(--red)';
  return `<div class="art" style="left:${a.x}px;top:${a.y}px;color:${color}">${handCircle(a.r, { seed: seed * 7 + 1, width: a.width ?? 5 })}</div>`;
}

/** "strong" gets light text ("on"); "soft" and none stay on ink. */
const bgClass = (bg) => (!bg ? '' : ['sage', 'strong', 'deep'].includes(bg) ? 'strong on' : bg);

const LAYOUTS = {
  cover: (s) => `
    <div>${logo()}</div>
    <div class="center">
      ${kicker(s.kicker)}
      <h1 style="font-size:${s.size ?? 124}px">${md(s.title)}</h1>
      ${s.hand ? `<div class="hand" style="margin-top:48px;font-size:60px">${md(s.hand)}</div>` : ''}
    </div>`,
  text: (s) => `
    <div class="center">
      ${kicker(s.kicker)}
      ${s.title ? `<h2>${md(s.title)}</h2>` : ''}
      ${s.body ? `<div class="body">${paras(s.body)}</div>` : ''}
      ${s.lines ? `<ul class="lines">${s.lines.map((l, i) => `<li>${handDot(s.n * 13 + i)}${md(l)}</li>`).join('')}</ul>` : ''}
      ${s.hand ? `<div class="hand" style="margin-top:44px">${md(s.hand)}</div>` : ''}
    </div>`,
  big: (s) => `
    <div class="center">
      ${kicker(s.kicker)}
      <h1 style="font-size:${s.size ?? 92}px">${md(s.title)}</h1>
      ${s.body ? `<div class="body">${paras(s.body)}</div>` : ''}
    </div>`,
  note: (s) => `
    <div class="center">
      ${s.title ? `<h2>${md(s.title)}</h2>` : ''}
      <div class="note">
        <span class="hand">${esc(s.hand ?? 'probalo')}</span>
        ${s.body ? `<div class="body" style="margin-top:0">${paras(s.body)}</div>` : ''}
        ${s.steps ? `<ol>${s.steps.map((x) => `<li>${md(x)}</li>`).join('')}</ol>` : ''}
      </div>
      ${s.after ? `<div class="body">${paras(s.after)}</div>` : ''}
    </div>`,
  cta: (s, ctx) => `
    <div class="center cta" style="display:flex;flex-direction:column">
      ${ctx.portrait ? `<div class="portrait"><img src="${ctx.portrait}"></div>` : ''}
      <h2>${md(s.title)}</h2>
      ${s.body ? `<div class="body">${paras(s.body)}</div>` : ''}
      <div class="sign">${SIGN}</div>
    </div>`,
};

window.paint = async (s, ctx) => {
  const root = document.getElementById('root');
  document.body.classList.toggle('reel', !!ctx.reel);
  document.body.dataset.theme = ctx.theme ?? 'mate';
  document.body.classList.toggle('large', ctx.textSize === 'large');
  const layout = LAYOUTS[s.layout ?? 'text'];
  if (!layout) throw new Error(`unknown layout ${s.layout}`);
  const foot = ctx.reel ? '' : `<div class="foot"><span>${HANDLE}</span>${s.layout === 'cover' ? '<span class="swipe">deslizá →</span>' : `<span>${s.n}/${ctx.total}</span>`}</div>`;
  root.innerHTML = `<section class="slide ${bgClass(s.bg)}">${grain(s.n + 3)}${(s.art ?? []).map((a, i) => art(a, s.n * 10 + i)).join('')}${layout(s, ctx)}${foot}</section>`;
  await document.fonts.ready;
  await Promise.all([...root.querySelectorAll('img')].map((img) => (img.complete ? null : new Promise((r) => (img.onload = img.onerror = r)))));
};
</script>
<script src="reel.js"></script>
</body>
</html>
